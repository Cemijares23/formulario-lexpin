<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Order your favorite burger at Burguer House!" />
    <title>Burguer House - Order Formr</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Burguer House</h1>
        <p>Make your order</p>
      </header>
      <main>
        <form action="order-success.html" method="GET">
          <fieldset>
            <legend>Contact Information</legend>

            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first-name" required />

            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="last-name" required />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required />
          </fieldset>

          <fieldset>
            <legend>Your Order</legend>

            <label for="burger">Choose your burger:</label>
            <select id="burger" name="burger" required>
              <option value="">- Select a burger -</option>
              <option value="classic">Classic Burger</option>
              <option value="cheese">Cheese Burger</option>
              <option value="bacon">Bacon Burger</option>
              <option value="veggie">Veggie Burger</option>
            </select>

            <label for="size">Quantity:</label>
            <input
              type="number"
              id="size"
              name="size"
              min="1"
              value="1"
              required
            />

            <label for="extras">Extras:</label>
            <input type="checkbox" id="cheese" name="extras" value="cheese" />
            <label for="cheese">Extra Cheese</label>

            <input type="checkbox" id="bacon" name="extras" value="bacon" />
            <label for="bacon">Extra Bacon</label>

            <input type="checkbox" id="onions" name="extras" value="onions" />
            <label for="onions">Grilled Onions</label>

            <input
              type="checkbox"
              id="mushrooms"
              name="extras"
              value="mushrooms"
            />
            <label for="mushrooms">Mushrooms</label>

            <label for="sauces">Drink: </label>
            <select id="drink" name="drink">
              <option value="">- Select a drink -</option>
              <option value="coke">Coke</option>
              <option value="pepsi">Pepsi</option>
              <option value="sprite">Sprite</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Delivery</legend>

            <input
              type="radio"
              id="pickup"
              name="delivery"
              value="pickup"
              required
            />
            <label for="pickup">Pickup</label>

            <input
              type="radio"
              id="delivery"
              name="delivery"
              value="delivery"
              required
            />
            <label for="delivery">Delivery</label>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required />

            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes"></textarea>

            <label for="payment">Payment Method:</label>
            <input
              type="radio"
              id="cash"
              name="payment"
              value="cash"
              required
            />
            <label for="cash">Cash</label>

            <input
              type="radio"
              id="card"
              name="payment"
              value="card"
              required
            />
            <label for="card">Card</label>

            <input
              type="radio"
              id="paypal"
              name="payment"
              value="paypal"
              required
            />
            <label for="paypal">Mobile Payment</label>
          </fieldset>

          <input type="submit" value="Place Order" />
        </form>
      </main>
    </div>
  </body>
</html>
